<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>字在其中 📚</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: #fdf6e3;
  color: #1a0a00;
  min-height: 100vh;
}

/* ── LOGIN ── */
#login-screen {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 30px 20px;
  background: linear-gradient(135deg, #fdf6e3, #f5ead0);
}
.login-title {
  font-size: clamp(40px, 12vw, 72px);
  color: #c0392b;
  text-shadow: 3px 3px 0 rgba(201,150,42,0.25);
  letter-spacing: 8px;
  margin-bottom: 6px;
}
.login-sub { color: #8b6f5e; font-size: 13px; letter-spacing: 3px; margin-bottom: 48px; }



.profile-cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }

.profile-card {
  background: white; border-radius: 24px;
  padding: 28px 24px; width: 185px; text-align: center;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(44,24,16,0.12);
  border: 2px solid transparent;
  transition: all .25s;
  position: relative;
}
.profile-card:hover { transform: translateY(-7px); box-shadow: 0 14px 36px rgba(44,24,16,0.18); }
.profile-card.kongkong:hover, .profile-card.kongkong.has-new { border-color: #c0392b; }
.profile-card.miaomiao:hover, .profile-card.miaomiao.has-new { border-color: #1a7a6e; }

.profile-avatar { font-size: 52px; margin-bottom: 10px; }
.profile-name { font-size: 21px; font-weight: 700; color: #1a0a00; margin-bottom: 3px; }
.profile-grade { font-size: 12px; color: #8b6f5e; margin-bottom: 12px; }
.profile-stats { border-top: 1px dashed #f5ead0; padding-top: 10px; font-size: 12px; color: #8b6f5e; }

/* ── APP ── */
#app { display: none; flex-direction: column; min-height: 100vh; }
#app.show { display: flex; }

.app-header {
  background: white; border-bottom: 2px solid #f5ead0;
  padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 40;
  box-shadow: 0 2px 10px rgba(44,24,16,0.1);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-avatar { font-size: 26px; }
.header-name { font-weight: 700; font-size: 16px; }
.header-grade { font-size: 11px; color: #8b6f5e; }
.header-right { display: flex; align-items: center; gap: 8px; }
.streak-badge { background: #fff8e1; border: 1px solid #f0c040; border-radius: 20px; padding: 3px 10px; font-size: 12px; color: #7d5a00; }
.btn-small { background: none; border: 1px solid #f5ead0; border-radius: 8px; padding: 5px 10px; font-size: 12px; color: #8b6f5e; cursor: pointer; }
.btn-small:hover { background: #f5ead0; }

.nav-tabs { display: flex; gap: 4px; padding: 10px 16px; border-bottom: 1px solid #f5ead0; }
.nav-tab { padding: 7px 16px; border-radius: 20px; font-size: 13px; border: none; cursor: pointer; background: transparent; color: #8b6f5e; transition: all .2s; }
.nav-tab.active { background: #1a0a00; color: white; }

.main { max-width: 760px; width: 100%; margin: 0 auto; padding: 20px 16px; }

/* ── ARTICLE ── */
.controls-card { background: white; border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(44,24,16,0.08); }
.controls-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ctrl-label { font-size: 10px; color: #8b6f5e; letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
.ctrl-select { width: 100%; padding: 8px 10px; border: 1.5px solid #f5ead0; border-radius: 10px; font-size: 13px; background: #fdf6e3; color: #1a0a00; }
.ctrl-input { width: 100%; padding: 8px 10px; border: 1.5px solid #f5ead0; border-radius: 10px; font-size: 13px; background: #fdf6e3; color: #1a0a00; }

.article-card { background: white; border-radius: 16px; padding: 24px 22px; box-shadow: 0 2px 12px rgba(44,24,16,0.08); }
.article-title { text-align: center; font-size: 24px; color: #c0392b; letter-spacing: 4px; margin-bottom: 18px; }
.article-body { font-size: 20px; line-height: 2.4; color: #1a0a00; letter-spacing: 0.5px; }
.article-legend { margin-top: 14px; padding-top: 12px; border-top: 1px dashed #f5ead0; font-size: 11px; color: #b0977a; display: flex; gap: 12px; flex-wrap: wrap; }

.zh { display: inline-block; cursor: pointer; border-radius: 3px; padding: 0 1px; transition: background .1s; }
.zh.unknown { border-bottom: 2px dotted #c0392b; color: #c0392b; }
.zh:hover { background: rgba(201,150,42,0.15); }


.btn-done { width: 100%; margin-top: 12px; padding: 11px; background: #1a7a6e; color: white; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; letter-spacing: 1px; }
.btn-done:hover { background: #156057; }
.done-msg { text-align: center; padding: 10px; font-size: 13px; color: #1a7a6e; margin-top: 8px; }

.empty-state { text-align: center; padding: 60px 20px; color: #8b6f5e; }
.empty-state .icon { font-size: 48px; margin-bottom: 14px; }
.empty-state p { font-size: 16px; letter-spacing: 1px; margin-bottom: 8px; }
.empty-state .hint { font-size: 13px; color: #b0977a; line-height: 1.8; }
.hint-code { background: #f5ead0; padding: 2px 8px; border-radius: 6px; font-family: monospace; font-size: 12px; }

/* ── TOOLTIP ── */
.tooltip {
  position: fixed; z-index: 999;
  background: #2c1810; color: #fdf6e3;
  padding: 14px 16px; border-radius: 14px; min-width: 155px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  pointer-events: all;
}
.tt-pinyin { font-size: 13px; color: #f0c040; margin-bottom: 2px; text-align: center; }
.tt-char { font-size: 30px; font-weight: bold; text-align: center; margin-bottom: 2px; }
.tt-status { font-size: 11px; color: #9a7060; text-align: center; margin-bottom: 10px; }
.tt-btns { display: flex; gap: 6px; }
.tt-btn { flex: 1; padding: 7px 4px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; }
.tt-know { background: #27ae60; color: white; }
.tt-unknown { background: #c0392b; color: white; }

/* ── VOCAB ── */
.vocab-section { margin-bottom: 26px; }
.vocab-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.vocab-section-title { font-size: 16px; font-weight: 700; color: #1a0a00; letter-spacing: 1px; }
.vocab-count { font-size: 12px; color: #8b6f5e; background: #f5ead0; padding: 2px 10px; border-radius: 10px; }
.vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.vocab-card { border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; transition: transform .15s; }
.vocab-card:hover { transform: scale(1.06); }
.vocab-card.unknown { background: linear-gradient(135deg, #fde8e8, #f5b7b1); }
.vocab-card.mastered { background: linear-gradient(135deg, #d5f4e6, #a8e6cf); }
.vocab-char { font-size: 26px; margin-bottom: 2px; }
.vocab-pinyin { font-size: 11px; color: #555; }
.vocab-tip { font-size: 11px; color: #b0977a; text-align: center; margin-top: 8px; }
.vocab-empty { font-size: 13px; color: #b0977a; padding: 6px 0; }

/* ── PROGRESS ── */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: white; border-radius: 16px; padding: 18px 16px; text-align: center; box-shadow: 0 2px 10px rgba(44,24,16,0.08); }
.stat-num { font-size: 38px; line-height: 1; margin-bottom: 4px; }
.stat-label { font-size: 12px; color: #8b6f5e; }
.progress-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(44,24,16,0.08); }
.progress-title { font-size: 14px; font-weight: 600; color: #1a0a00; margin-bottom: 12px; }
.prog-track { background: #f5ead0; border-radius: 999px; height: 13px; overflow: hidden; margin-bottom: 6px; }
.prog-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #c0392b, #c9962a); transition: width 1s; }
.prog-labels { display: flex; justify-content: space-between; font-size: 12px; color: #8b6f5e; }
.history-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 10px rgba(44,24,16,0.08); }
.history-title { font-size: 15px; font-weight: 700; color: #1a0a00; margin-bottom: 12px; }
.history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #f5ead0; }
.history-item:last-child { border-bottom: none; }
.history-name { font-size: 14px; color: #1a0a00; }
.history-chars { font-size: 11px; color: #1a7a6e; }
.history-date { font-size: 12px; color: #8b6f5e; }

/* ── SAVING INDICATOR ── */
.saving { position: fixed; bottom: 20px; right: 20px; background: #1a7a6e; color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 100; opacity: 0; transition: opacity .3s; }
.saving.show { opacity: 1; }

@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.fade-up { animation: fadeUp .35s ease; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-title">字在其中</div>
  <div class="login-sub">选择你的账户，开始阅读 ✨</div>

  <div class="profile-cards">
    <div class="profile-card kongkong" id="card-kongkong" onclick="login('kongkong')">
      <div class="profile-avatar">🐒</div>
      <div class="profile-name">空空</div>
      
      <div class="profile-stats" id="stats-kongkong">读取中…</div>
    </div>
    <div class="profile-card miaomiao" id="card-miaomiao" onclick="login('miaomiao')">
      <div class="profile-avatar">🐱</div>
      <div class="profile-name">妙妙</div>
      
      <div class="profile-stats" id="stats-miaomiao">读取中…</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div class="header-left">
      <span class="header-avatar" id="h-avatar"></span>
      <div>
        <div class="header-name" id="h-name"></div>
        <div class="header-grade" id="h-grade"></div>
      </div>
    </div>
    <div class="header-right">
      <span class="streak-badge">🔥 <span id="h-streak">0</span> 天</span>
      <button class="btn-small" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="read" onclick="switchTab('read')">📖 阅读</button>
    <button class="nav-tab" data-tab="vocab" onclick="switchTab('vocab')">📝 生字本</button>
    <button class="nav-tab" data-tab="progress" onclick="switchTab('progress')">🌟 进步</button>
    <button class="nav-tab" data-tab="history" onclick="switchTab('history')">📜 旧文章</button>
  </div>
  <div class="main">
    <!-- READ -->
    <div id="tab-read">
      <div id="generate-controls" class="controls-card">
        <div class="controls-row">
          <div style="flex:1;min-width:120px">
            <div class="ctrl-label">主题</div>
            <select class="ctrl-select" id="topic-mode" onchange="toggleTopicInput()">
              <option value="auto">🎲 AI随机话题</option>
              <option value="manual">✏️ 我来指定</option>
            </select>
          </div>
          <div style="flex:2;min-width:140px;display:none" id="topic-input-wrap">
            <div class="ctrl-label">话题内容</div>
            <input class="ctrl-input" id="topic-input" placeholder="比如：小猫的冒险…"/>
          </div>
          <div style="flex:1;min-width:100px">
            <div class="ctrl-label">长度</div>
            <select class="ctrl-select" id="art-len">
              <option value="short">短文 ~80字</option>
              <option value="medium" selected>中篇 ~180字</option>
              <option value="long">长文 ~320字</option>
            </select>
          </div>
          <button onclick="generateArticle()" id="gen-btn" style="padding:9px 20px;background:#c0392b;color:white;border:none;border-radius:12px;font-size:14px;cursor:pointer;white-space:nowrap;align-self:flex-end">✦ 生成文章</button>
        </div>
      </div>
      <div id="article-area"></div>
    </div>
    <!-- VOCAB -->
    <div id="tab-vocab" style="display:none">
      <div class="vocab-section">
        <div class="vocab-section-header">
          <div class="vocab-section-title">🔴 需要加强</div>
          <div class="vocab-count" id="cnt-unknown">0 个字</div>
        </div>
        <div class="vocab-grid" id="grid-unknown"></div>
      </div>
      <div class="vocab-section">
        <div class="vocab-section-header">
          <div class="vocab-section-title">🟢 已掌握</div>
          <div class="vocab-count" id="cnt-mastered">0 个字</div>
        </div>
        <div class="vocab-grid" id="grid-mastered"></div>
      </div>
      <div class="vocab-tip">💡 点击字卡可以切换认识 / 不认识</div>
    </div>
    <!-- PROGRESS -->
    <div id="tab-progress" style="display:none">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num" id="s-mastered" style="color:#c0392b">0</div><div class="stat-label">认识的字</div></div>
        <div class="stat-card"><div class="stat-num" id="s-articles" style="color:#1a7a6e">0</div><div class="stat-label">读过的文章</div></div>
        <div class="stat-card"><div class="stat-num" id="s-streak" style="color:#c9962a">0</div><div class="stat-label">连续天数</div></div>
        <div class="stat-card"><div class="stat-num" id="s-unknown" style="color:#8e44ad">0</div><div class="stat-label">生字待学</div></div>
      </div>
      <div class="progress-card">
        <div class="progress-title" id="prog-title">词汇掌握进度</div>
        <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
        <div class="prog-labels"><span id="prog-left">0 个已掌握</span><span id="prog-right">目标 600 字</span></div>
      </div>
      <div class="history-card">
        <div class="history-title">📖 阅读记录</div>
        <div id="history-list"></div>
      </div>
    </div>
    <!-- HISTORY -->
    <div id="tab-history" style="display:none">
      <div id="history-articles"></div>
    </div>
  </div>
</div>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip" style="display:none">
  <div class="tt-pinyin" id="tt-pinyin"></div>
  <div class="tt-char" id="tt-char"></div>
  <div class="tt-status" id="tt-status"></div>
  
  <div class="tt-btns">
    <button class="tt-btn tt-know" onclick="markChar('known')">✓ 认识</button>
    <button class="tt-btn tt-unknown" onclick="markChar('unknown')">✗ 不认识</button>
  </div>
</div>

<div class="saving" id="saving-indicator">已保存 ✓</div>

// ════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════
let currentUser = null;
let ud = {};
let activeChar = null;
let articleSaved = false;

// ════════════════════════════════════════════
// API
// ════════════════════════════════════════════
const IS_LOCAL = location.protocol === "file:";

async function apiLoad(uid) {
  if (IS_LOCAL) {
    try { return JSON.parse(localStorage.getItem("ud_"+uid)||"{}"); } catch(e) {}
    return {};
  }
  try {
    const r = await fetch(`/api/userdata?uid=${uid}`);
    if (r.ok) {
      const data = await r.json();
      console.log("Loaded data for", uid, data);
      return data;
    }
    console.warn("apiLoad failed:", r.status);
  } catch(e) { console.error("apiLoad error:", e); }
  return {};
}

async function apiSave(uid, data) {
  if (IS_LOCAL) {
    try { localStorage.setItem("ud_"+uid, JSON.stringify(data)); showSaving(); } catch(e) {}
    return;
  }
  try {
    const r = await fetch(`/api/userdata?uid=${uid}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    if (r.ok) {
      console.log("Saved data for", uid);
      showSaving();
    } else {
      console.warn("apiSave failed:", r.status, await r.text());
    }
  } catch(e) { console.error("apiSave error:", e); }
}

function showSaving() {
  const el = document.getElementById("saving-indicator");
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1500);
}

function emptyUD() {
  return { masteredChars:{}, unknownChars:{}, articleHistory:[], streak:0, lastActiveDate:null, totalArticles:0 };
}

// ════════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════════
async function initLogin() {

  // Load stats
  for (const uid of ["kongkong","miaomiao"]) {
    const data = await apiLoad(uid);
    const mastered = Object.keys(data.masteredChars||{}).length;
    const articles = data.totalArticles||0;
    document.getElementById("stats-"+uid).innerHTML = `📖 ${articles} 篇文章`;
  }
}

async function login(userId) {
  currentUser = userId;
  ud = await apiLoad(userId);
  if (!ud.masteredChars) ud = emptyUD();

  // Streak
  const today = new Date().toDateString();
  if (!ud.lastActiveDate) ud.streak = 1;
  else if (ud.lastActiveDate !== today) {
    const yest = new Date(Date.now()-86400000).toDateString();
    ud.streak = ud.lastActiveDate===yest ? (ud.streak||0)+1 : 1;
  }
  ud.lastActiveDate = today;
  await apiSave(userId, ud);

  const p = PROFILES[userId];
  document.getElementById("h-avatar").textContent = p.avatar;
  document.getElementById("h-name").style.color = p.color;
  document.getElementById("h-name").textContent = p.name;
  
  document.getElementById("h-streak").textContent = ud.streak||0;

  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").classList.add("show");
  articleSaved = false;
  switchTab("read");
}

function logout() {
  currentUser = null;
  document.getElementById("app").classList.remove("show");
  document.getElementById("login-screen").style.display = "flex";
  initLogin();
}

// ════════════════════════════════════════════
// TABS
// ════════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
  document.querySelector(`[data-tab="${tab}"]`).classList.add("active");
  ["read","vocab","progress","history"].forEach(t => {
    document.getElementById("tab-"+t).style.display = t===tab ? "block" : "none";
  });
  if (tab==="read") renderArticle();
  if (tab==="vocab") renderVocab();
  if (tab==="progress") renderProgress();
  if (tab==="history") renderHistory();
}

// ════════════════════════════════════════════
// ARTICLE
// ════════════════════════════════════════════
function renderArticle() {
  const area = document.getElementById("article-area");
  // Use last generated article if available, otherwise use hardcoded ARTICLE
  const savedArticle = ud.lastArticle;
  const fallbackArticle = ARTICLE && ARTICLE.user === currentUser ? ARTICLE : null;
  const activeArticle = savedArticle || fallbackArticle;
  if (activeArticle) window._lastArticle = activeArticle;

  if (!activeArticle) {
    const p = PROFILES[currentUser];
    area.innerHTML = `
      <div class="empty-state fade-up">
        <div class="icon">📚</div>
        <p>还没有文章</p>
        <div class="hint">点击上方按钮生成一篇吧！</div>
      </div>`;
    return;
  }

  const isCN = c => /[\u4e00-\u9fff]/.test(c);
  let bodyHTML = "";
  for (const char of activeArticle.body) {
    if (!isCN(char)) {
      bodyHTML += char==="\n" ? "<br>" : char;
      continue;
    }
    const isU = !!ud.unknownChars?.[char];
    bodyHTML += `<span class="zh${isU?" unknown":""}" onclick="charClick(this,'${char}')">${char}</span>`;
  }

  area.innerHTML = `
    <div class="article-card fade-up">
      <div class="article-title">${activeArticle.title}</div>
      <div class="article-body">${bodyHTML}</div>
      <div class="article-legend">
        <span>点击汉字看拼音</span>
        
      </div>
    </div>
    ${!articleSaved ? `<button class="btn-done" onclick="markDone()">✓ 我读完了，保存记录</button>` : `<div class="done-msg">✅ 已保存到阅读记录！</div>`}
  `;
}

async function markDone() {
  if (articleSaved) return;
  const art = window._lastArticle;
  if (!art || !art.body) return;
  ud.totalArticles = (ud.totalArticles||0)+1;
  const cleanHistory = (ud.articleHistory||[]).filter(h => h.body && h.body.length > 0);
  ud.articleHistory = [
    { title: art.title, date: new Date().toLocaleDateString("zh-CN"), charCount: art.body.length, body: art.body },
    ...cleanHistory
  ].slice(0,20);
  articleSaved = true;
  await apiSave(currentUser, ud);
  renderArticle();
}

// ════════════════════════════════════════════
// TOOLTIP
// ════════════════════════════════════════════
async function charClick(el, char) {
  activeChar = { char, el };
  let pinyin = PINYIN[char];

  // If pinyin missing, ask Claude for it
  if (!pinyin) {
    document.getElementById("tt-pinyin").textContent = "…";
    document.getElementById("tt-char").textContent = char;
    document.getElementById("tt-status").textContent = "";
    const tt = document.getElementById("tooltip");
    tt.style.display = "block";
    const rect = el.getBoundingClientRect();
    const top = Math.max(10, rect.top - 130);
    const left = Math.min(window.innerWidth-165, Math.max(10, rect.left-55));
    tt.style.top = top+"px"; tt.style.left = left+"px";
    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: `汉字"${char}"的拼音是什么？只返回拼音，不要其他内容。`, max_tokens: 50 })
      });
      const data = await res.json();
      pinyin = data.text?.trim() || "···";
      PINYIN[char] = pinyin;
    } catch(e) {
      pinyin = "···";
    }
  }

  const isU = !!ud.unknownChars?.[char];
  document.getElementById("tt-pinyin").textContent = pinyin;
  document.getElementById("tt-char").textContent = char;
  document.getElementById("tt-status").textContent = isU ? "📌 不认识" : "✅ 认识";
  const tt = document.getElementById("tooltip");
  tt.style.display = "block";
  const rect = el.getBoundingClientRect();
  const top = Math.max(10, rect.top - 130);
  const left = Math.min(window.innerWidth-165, Math.max(10, rect.left-55));
  tt.style.top = top+"px"; tt.style.left = left+"px";
}

async function markChar(status) {
  if (!activeChar) return;
  const { char } = activeChar;
  const pinyin = PINYIN[char]||"···";
  const now = new Date().toISOString();
  if (!ud.unknownChars) ud.unknownChars = {};
  if (!ud.masteredChars) ud.masteredChars = {};
  if (status==="known") {
    ud.masteredChars[char] = { pinyin, masteredDate:now };
    delete ud.unknownChars[char];
    document.querySelectorAll(".zh").forEach(el => { if (el.textContent===char) el.classList.remove("unknown"); });
  } else {
    ud.unknownChars[char] = { pinyin, firstSeen:ud.unknownChars[char]?.firstSeen||now, seenCount:(ud.unknownChars[char]?.seenCount||0)+1 };
    delete ud.masteredChars[char];
    document.querySelectorAll(".zh").forEach(el => { if (el.textContent===char) el.classList.add("unknown"); });
  }
  hideTooltip();
  await apiSave(currentUser, ud);
  renderVocabIfActive();
}

function hideTooltip() {
  document.getElementById("tooltip").style.display = "none";
  activeChar = null;
}

document.addEventListener("click", e => {
  if (!e.target.closest("#tooltip") && !e.target.classList.contains("zh")) hideTooltip();
});

// ════════════════════════════════════════════
// VOCAB
// ════════════════════════════════════════════
function renderVocabIfActive() {
  if (document.getElementById("tab-vocab").style.display !== "none") renderVocab();
}

function renderVocab() {
  const unknown = Object.entries(ud.unknownChars||{});
  const mastered = Object.entries(ud.masteredChars||{});

  document.getElementById("cnt-unknown").textContent = unknown.length+" 个字";
  document.getElementById("cnt-mastered").textContent = mastered.length+" 个字";

  const makeGrid = (items, type) => {
    if (!items.length) return `<div class="vocab-empty">${type==="unknown"?"太棒了，暂无生字 👍":"阅读时点击汉字标记！"}</div>`;
    return items.map(([c,d]) => `
      <div class="vocab-card ${type}" onclick="toggleVocabChar('${c}','${type}')">
        <div class="vocab-char">${c}</div>
        <div class="vocab-pinyin">${d.pinyin||PINYIN[c]||"···"}</div>
      </div>`).join("");
  };

  document.getElementById("grid-unknown").innerHTML = makeGrid(unknown, "unknown");
  document.getElementById("grid-mastered").innerHTML = makeGrid(mastered, "mastered");
}

async function toggleVocabChar(char, currentType) {
  const newStatus = currentType==="mastered" ? "unknown" : "known";
  activeChar = { char, el:null };
  await markChar(newStatus);
  renderVocab();
}

// ════════════════════════════════════════════
// PROGRESS
// ════════════════════════════════════════════
function renderProgress() {
  const mastered = Object.keys(ud.masteredChars||{}).length;
  const unknown = Object.keys(ud.unknownChars||{}).length;
  const p = PROFILES[currentUser];
  const pct = Math.min(100, Math.round(mastered/p.vocabTarget*100));

  document.getElementById("s-mastered").textContent = mastered;
  document.getElementById("s-articles").textContent = ud.totalArticles||0;
  document.getElementById("s-streak").textContent = ud.streak||0;
  document.getElementById("s-unknown").textContent = unknown;
  document.getElementById("prog-title").textContent = p.grade+"词汇掌握进度";
  document.getElementById("prog-fill").style.width = pct+"%";
  document.getElementById("prog-left").textContent = mastered+" 个已掌握";
  document.getElementById("prog-right").textContent = "目标 "+p.vocabTarget+" 字（"+pct+"%）";

  const hist = ud.articleHistory||[];
  document.getElementById("history-list").innerHTML = hist.length===0
    ? `<div style="text-align:center;color:#b0977a;padding:20px;font-size:13px">还没有阅读记录</div>`
    : hist.map(h=>`
      <div class="history-item">
        <div><div class="history-name">${h.title}</div><div class="history-chars">约 ${h.charCount} 字</div></div>
        <div class="history-date">${h.date}</div>
      </div>`).join("");
}

// ════════════════════════════════════════════
// HISTORY
// ════════════════════════════════════════════
function renderHistory() {
  const hist = (ud.articleHistory || []).filter(h => h.body && h.body.length > 0);
  const area = document.getElementById("history-articles");
  if (!hist.length) {
    area.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>还没有阅读记录</p></div>`;
    return;
  }
  area.innerHTML = hist.map((h, i) => `
    <div class="article-card fade-up" style="margin-bottom:16px;cursor:pointer" onclick="loadHistoryArticle(${i})">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:18px;color:#c0392b;font-weight:700;letter-spacing:2px">${h.title}</div>
        <div style="font-size:12px;color:#8b6f5e">${h.date}</div>
      </div>
      <div style="font-size:12px;color:#1a7a6e;margin-top:4px">约 ${h.charCount} 字</div>
    </div>`).join("");
}

function loadHistoryArticle(idx) {
  const h = (ud.articleHistory || [])[idx];
  if (!h) return;
  switchTab("read");
  if (h.body) {
    renderGeneratedArticle(h.title, h.body);
  } else {
    // old records without body - just show title
    document.getElementById("article-area").innerHTML = `
      <div class="article-card"><div class="article-title">${h.title}</div>
      <div style="text-align:center;color:#b0977a;padding:20px;font-size:13px">这篇文章内容没有保存，请重新生成</div></div>`;
  }
}

// ════════════════════════════════════════════
// GENERATE ARTICLE
// ════════════════════════════════════════════
// API calls go through backend /api/generate

function toggleTopicInput() {
  const mode = document.getElementById("topic-mode").value;
  document.getElementById("topic-input-wrap").style.display = mode === "manual" ? "block" : "none";
}

async function generateArticle() {
  if (!currentUser) return;
  const btn = document.getElementById("gen-btn");
  btn.disabled = true;
  btn.textContent = "✦ 写作中…";

  const profile = PROFILES[currentUser];
  const mode = document.getElementById("topic-mode").value;
  const topic = document.getElementById("topic-input").value.trim();
  const len = document.getElementById("art-len").value;
  const lenMap = { short:"约80字", medium:"约180字", long:"约320字" };
  const allUnknown = Object.keys(ud.unknownChars||{});
  const shuffled = allUnknown.sort(()=>Math.random()-0.5);
  const unknownList = shuffled.slice(0, Math.min(5, shuffled.length)).join("、");
  const topicLine = mode==="manual" && topic
    ? "话题："+topic
    : "自选有趣贴近儿童生活的话题（动物冒险、季节、友情、魔法、美食，每次不同）";

  const masteredList = Object.keys(ud.masteredChars||{}).slice(0,50).join("");
  const isBeginner = profile.grade === "初学者";

  const SIYUKUAIDU_CORE = "一二三四五六七八九十上下大小多少人口手足目耳山水火土日月星爸妈哥姐弟妹猫狗鱼鸟红黄蓝绿来去吃喝玩看好不是有";

  const prompt = isBeginner
    ? `你是专业儿童中文老师，给刚开始学中文的5岁孩子写一篇极简短文，基于《四五快读》第一册水平。
要求：
1. ${topicLine}
2. 长度：最多50个字，句子极短（每句2-5个字）
3. 只使用以下基础字：${SIYUKUAIDU_CORE}
4. 如果有这些生字请自然重复：${unknownList||"无"}
5. 句子要像儿歌一样朗朗上口
6. 第一行是标题（2-4个字），空一行后写正文
直接输出标题和正文，不要任何格式标记或说明。标题要有创意，每次都不同。`
    : `你是专业儿童中文老师，给${profile.grade}孩子写一篇短文。
要求：
1. ${topicLine}
2. 长度：${lenMap[len]}
3. 用词适合${profile.grade}水平，句子简单有趣
4. 70%用孩子熟悉的字：${masteredList||"最基础常见的字"}；随机融入1-3个生字：${unknownList||"无"}；自然引入1-2个新词
5. 有趣味性，有画面感，每次话题和风格都新鲜
6. 第一行是标题（4-6字），空一行后写正文
直接输出标题和正文，不要任何格式标记或说明。标题要有创意，每次都不同。`;

  document.getElementById("article-area").innerHTML = `
    <div style="text-align:center;padding:60px 20px;color:#8b6f5e">
      <div style="font-size:40px;margin-bottom:12px;display:inline-block;animation:spin 1.5s linear infinite">🖌️</div>
      <div style="font-size:16px;letter-spacing:2px">正在为你写一篇专属文章…</div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>`;

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt })
    });
    const data = await res.json();
    const text = data.text || "";

    const lines = text.trim().split("\n").filter(l => l.trim());
    const title = lines[0] || "有趣的故事";
    const body = lines.slice(1).join("\n").trim() || text;
    if (!body) body = text;


    window.CURRENT_GENERATED = { user: currentUser, title, body };
    ud.lastArticle = { title, body };
    await apiSave(currentUser, ud);
    renderGeneratedArticle(title, body);

  } catch(e) {
    document.getElementById("article-area").innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>生成失败，请再试</p></div>`;
  }

  btn.disabled = false;
  btn.textContent = "✦ 生成文章";
}

function renderGeneratedArticle(title, body) {
  articleSaved = false;
  window._lastArticle = { title, body };
  const isCN = c => /[\u4e00-\u9fff]/.test(c);
  let bodyHTML = "";
  for (const char of body) {
    if (!isCN(char)) { bodyHTML += char==="\n" ? "<br>" : char; continue; }
    bodyHTML += `<span class="zh" onclick="charClick(this,'${char}')">${char}</span>`;
  }
  document.getElementById("article-area").innerHTML = `
    <div class="article-card fade-up">
      <div class="article-title">${title}</div>
      <div class="article-body">${bodyHTML}</div>
      <div class="article-legend">
        <span>点击汉字看拼音</span>
        
      </div>
    </div>
    <button class="btn-done" onclick="saveDoneGenerated()">✓ 我读完了，保存记录</button>`;
}

async function saveDoneGenerated() {
  if (articleSaved) return;
  const art = window._lastArticle;
  if (!art || !art.body) return;
  ud.totalArticles = (ud.totalArticles||0)+1;
  // Filter out old articles without body content
  const cleanHistory = (ud.articleHistory||[]).filter(h => h.body && h.body.length > 0);
  ud.articleHistory = [
    { title: art.title, date: new Date().toLocaleDateString("zh-CN"), charCount: art.body.length, body: art.body },
    ...cleanHistory
  ].slice(0,20);
  articleSaved = true;
  await apiSave(currentUser, ud);
  document.querySelector(".btn-done").outerHTML = `<div class="done-msg">✅ 已保存到阅读记录！</div>`;
}

// INIT

initLogin();
</script>
